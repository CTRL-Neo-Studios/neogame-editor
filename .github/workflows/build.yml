name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            bundle: src-tauri/target/release/bundle
          - name: macos
            os: macos-latest
            # one .app/.dmg for both Apple Silicon and Intel
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - name: linux
            os: ubuntu-22.04
            args: ''
            bundle: src-tauri/target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # linux is best-effort: a red linux job shouldn't fail the run
    continue-on-error: ${{ matrix.name == 'linux' }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # beforeBuildCommand in tauri.conf.json runs `bun run generate` for the frontend
      - name: Build app
        run: bun run tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: neomap-editor-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: error
